<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="brand-bar">
      <img src="assets/img/logo-shortbanknote.svg" alt="Logo de ShortBankNote: billete verde con las iniciales SB en dorado" class="brand-logo">
      <span class="brand-name">ShortBank<span class="brand-accent">Note</span></span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="login-wrapper">
    <div class="hero">
      <img
        src="assets\img\illust-login.jpg"
        alt="Ilustración de una billetera abierta con billetes y monedas junto a un teléfono que muestra un gráfico de ahorro"
        class="hero-img" width="320" height="200">
      <h1>¡Bienvenido a ShortBankNote!</h1>
      <p class="tagline">Tus cuentas claras, en el bolsillo.</p>
    </div>

    <form #loginForm="ngForm" class="login-card">
      <ion-input label="Nombre de Usuario" labelPlacement="floating" fill="outline" placeholder="Ingrese su usuario"
        name="usuario" [(ngModel)]="usuario" #usuarioField="ngModel"
        required minlength="3" maxlength="8" pattern="^[a-zA-Z0-9]+$"></ion-input>
      <ion-note color="danger" *ngIf="usuarioField.invalid && usuarioField.touched">
        El usuario debe ser alfanumérico, entre 3 y 8 caracteres.
      </ion-note>

      <ion-input label="Contraseña" labelPlacement="floating" fill="outline" type="password" placeholder="Ingrese su Contraseña"
        name="contrasena" [(ngModel)]="contrasena" #contrasenaField="ngModel"
        required maxlength="4" inputmode="numeric" pattern="^[0-9]{4}$"></ion-input>
      <ion-note color="danger" *ngIf="contrasenaField.invalid && contrasenaField.touched">
        La contraseña debe ser numérica de 4 dígitos.
      </ion-note>

      <div class="acciones">
        <ion-button expand="block" color="primary" [disabled]="loginForm.invalid" (click)="ingresar()">Iniciar Sesión</ion-button>
        <ion-button expand="block" fill="outline" color="primary" (click)="irRegistro()">Registrar</ion-button>
      </div>
    </form>

  </div>

</ion-content>
